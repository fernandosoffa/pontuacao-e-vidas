<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pontuação</title>
    <link rel="shortcut icon" href="https://i.postimg.cc/4dhf2XcR/favicon.png" type="image/png">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>🎯 Treino de Pontuação</h1>

        <div class="status">
            <div class="card">
                <span class="label">Pontuação</span>
                <span id="score">0</span>
            </div>

            <div class="card">
                <span class="label">Vidas</span>
                <span id="lives">❤️❤️❤️</span>
            </div>
        </div>

        <div class="buttons">
            <button class="btn add" onclick="addPoint()">Ganhar pontos</button>
            <button class="btn lose" onclick="losePoint()">Perder pontos</button>
            <button class="btn bonus" onclick="bonus()">Bônus</button>
        </div>

        <button class="reset" onclick="resetGame()">Resetar jogo</button>
    </div>

    <script src="script.js"></script>
</body>
</html>
